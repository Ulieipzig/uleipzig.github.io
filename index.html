<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO & Metadata -->
    <title>Shoppe in deinem Kiez | Shoppe Local | Uleipzig.com</title>
    <meta name="description" content="Entdecke lokale Geschäfte in Leipzig auf ULeipzig.com.">
    <link rel="canonical" href="https://uleipzig.com">

    <!-- FAVICON SETUP mit Herz.png -->
    <link rel="icon" href="Herz.png" sizes="32x32" type="image/png">
    <link rel="icon" href="Herz.png" sizes="48x48" type="image/png">
    <link rel="icon" href="Herz.png" sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="shortcut icon" href="logo.png" type="image/png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            width: 100vw;
            background-color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
        }

        .logo-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('LOGOhoch.png') no-repeat center center / contain #ffffff;
            z-index: 1;
        }

        .click-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            cursor: default;
        }

        .hero-content {
            position: relative;
            margin-bottom: 100px;
            z-index: 15;
            color: #333;
            text-align: center;
            pointer-events: none;
        }

        h1 {
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            /* Sanfter Übergang beim Textwechsel */
            transition: opacity 0.5s ease-in-out;
        }

        p {
            font-size: 1.1rem;
            opacity: 0.8;
        }

        @media (max-height: 600px) {
            .hero-content {
                margin-bottom: 60px;
            }

            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="logo-background"></div>
    <div class="click-overlay"></div>

    <header class="hero-content">
        <!-- Die ID 'changing-text' wird vom Script genutzt -->
        <h1 id="changing-text">Shoppe Local</h1>
        <p>Uleipzig.com</p>
    </header>

    <script>
        // HIER DEINE TEXTE EINFÜGEN:
        const texte = [
            "Shoppe Local",
            "Shoppe deinen Kiez",
            "Bald",
            "Mach mit",
            "Comming Soon",
            "Dezember",
            "Januar",
            "WIR",
            "Entdecke Leipzig",
            "Liebe deine Stadt",
            "Shoppe Leipzig",
            "Shoppe Heimat",
            "Shoppe Direkt",
            "Shoppe Nachhaltig",
            "Bleib dabei",
            "WE",
            "Zusammen",
            "Du bist Leipzig ❤",
            "Wir sind Leipzig ❤",
            "Nachbarschaft",
            "local Hero",
            "Support",
            "Shoppe dein Kiez",
            "Uleipzig.com ❤"



        ];

        let index = 0;
        const textElement = document.getElementById('changing-text');

        function changeText() {
            // Text ausblenden
            textElement.style.opacity = 0;

            setTimeout(() => {
                // Index erhöhen
                index = (index + 1) % texte.length;
                // Text ändern
                textElement.innerText = texte[index];
                // Text wieder einblenden
                textElement.style.opacity = 1;
            }, 500); // 0.5 Sek warten bis der Text unsichtbar ist, dann tauschen
        }

        // Alle 2000ms (2 Sekunden) ausführen
        setInterval(changeText, 2000);

        // Vorhandener Mobile-Fix
        document.addEventListener('DOMContentLoaded', () => {
            let lastTouch = 0;
            document.addEventListener('touchend', (e) => {
                const now = Date.now();
                if (now - lastTouch <= 300) e.preventDefault();
                lastTouch = now;
            }, { passive: false });
        });
    </script>
</body>
</html>
